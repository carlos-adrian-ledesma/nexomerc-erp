name: Backend tests (no GUI)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check publication files
        run: python scripts/check_publication.py
      - name: Compile Python sources
        run: python -m compileall -q run.py nexomerc scripts tests
      - name: Run backend suite (without PySide6)
        run: python scripts/test_backend.py
